spring:
  application:
    name: AutoLog
  profiles:
    active: local

---

server:
  port: 8080

spring:
  liquibase:
    enabled: false
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
#  datasource:
#    url: jdbc:postgresql://localhost:5432/AutoLog
#    username: AutoLog_Admin
#    password:

springdoc:
  api-docs:
    enabled: true
    path: /v1/api-docs



---

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/AutoLog
    username: AutoLog_Admin
    password:
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 10000
server:
  tomcat:
    threads:
      max: 10
      min-spare: 2

springdoc:
  api-docs:
    enabled: false